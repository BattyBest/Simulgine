name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build Binary
      run: cargo build --bin simulgine --release --verbose
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: binary
        path: target/release/simulgine
    - name: Build Library
      run: cargo build --lib --release --verbose
    - name: Run tests
      run: cargo test --verbose
