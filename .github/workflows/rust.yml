name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Upload build artifacts
      uses: actions/upload-artifact@7.0.1
      with:
        name: binary
        path: target/release/Simulgine
    - name: Run tests
      run: cargo test --verbose
